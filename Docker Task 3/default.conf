server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Document root
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Access logs stored in bind-mounted volume
    access_log  /var/opt/nginx/access.log;
    error_log   /var/opt/nginx/error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # Custom error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Serve files from the bind-mounted volume path
    location /opt-files/ {
        alias /var/opt/nginx/;
        autoindex on;
    }
}
