<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Details | Docker Task 2</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(-45deg, #ff6ec4, #7873f5, #4ade80, #facc15);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .card {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(15px);
        border-radius: 20px;
        padding: 50px 60px;
        text-align: center;
        color: #fff;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.3);
        transition: transform 0.4s ease, box-shadow 0.4s ease;
        max-width: 450px;
    }

    .card:hover {
        transform: scale(1.05) rotate(-1deg);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }

    .avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: linear-gradient(135deg, #f857a6, #ff5858);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        font-weight: bold;
        margin: 0 auto 20px;
        box-shadow: 0 0 25px rgba(255,255,255,0.6);
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%, 100% { box-shadow: 0 0 15px rgba(255,255,255,0.5); }
        50% { box-shadow: 0 0 35px rgba(255,255,255,0.9); }
    }

    h1 {
        font-size: 28px;
        margin-bottom: 5px;
        letter-spacing: 1px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .badge {
        display: inline-block;
        background: rgba(255,255,255,0.25);
        padding: 4px 14px;
        border-radius: 30px;
        font-size: 13px;
        margin-bottom: 20px;
        letter-spacing: 1px;
    }

    .details {
        text-align: left;
        margin-top: 20px;
    }

    .details p {
        font-size: 16px;
        margin: 10px 0;
        padding: 8px 14px;
        background: rgba(255,255,255,0.12);
        border-radius: 10px;
        transition: background 0.3s, transform 0.2s;
    }

    .details p:hover {
        background: rgba(255,255,255,0.3);
        transform: translateX(5px);
    }

    .details b { color: #ffe97f; }

    .footer {
        margin-top: 25px;
        font-size: 12px;
        opacity: 0.8;
    }

    .tag {
        display: inline-block;
        background: #ff6ec4;
        color: #fff;
        padding: 3px 10px;
        border-radius: 8px;
        font-size: 11px;
        margin: 3px;
        font-weight: bold;
    }
</style>
</head>
<body>
    <div class="card">
        <div class="avatar">MA</div>
        <h1>Mussadiq Ali Abbas</h1>
        <div class="badge">🚀 DevOps Enthusiast</div>

        <div class="details">
            <p><b>🎓 Course:</b> DevOps Training</p>
            <p><b>📦 Task:</b> Docker Task - 2</p>
            <p><b>📧 Email:</b> mussadiq.116@gmail.com</p>
            <p><b>🌍 Deployed On:</b> AWS EC2</p>
        </div>

        <div style="margin-top:20px;">
            <span class="tag">Docker</span>
            <span class="tag">Nginx</span>
            <span class="tag">AWS EC2</span>
            <span class="tag">Docker Compose</span>
        </div>

        <div class="footer">Containerized & Deployed with ❤️</div>
    </div>
</body>
